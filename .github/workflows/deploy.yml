name: Deploy Quantum Minerals website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[pages-sync]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix leadership section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('artifacts/qmc-quantum-minerals/src/App.tsx')
          text = path.read_text()

          # Remove the three placeholder leadership cards completely.
          text, count = re.subn(
              r'<div className="mt-px grid gap-px bg-white/10 md:grid-cols-3">.*?</div>\n      </div>\n    </div>\n  </section>;',
              '</div>\n    </div>\n  </section>;',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Could not find the placeholder leadership cards.')

          # Make Sarah's name clearly larger than her role/title and match the Head of Mining and Production color.
          text = text.replace(
              '<p className="eyebrow">Sarah Thompson</p>',
              '<p className="display-font text-3xl leading-none tracking-[-.02em] text-[#e8aa62] md:text-4xl">Sarah Thompson</p>',
              1,
          )
          text = text.replace(
              'className="display-font mt-4 text-4xl leading-[1.02] text-[#f1e9db] md:text-6xl">Member of the Board of Directors',
              'className="display-font mt-3 text-2xl leading-[1.08] text-[#f1e9db] md:text-3xl">Member of the Board of Directors',
              1,
          )

          path.write_text(text)
          PY

      - name: Build website
        env:
          PORT: 4173
          BASE_PATH: /
          NODE_ENV: production
        run: pnpm --filter @workspace/qmc-quantum-minerals build

      - name: Sync built site to repository root
        run: |
          cp -a artifacts/qmc-quantum-minerals/dist/public/. ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository root is already synchronized."
          else
            git commit -m "[pages-sync] Sync built website to root"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/qmc-quantum-minerals/dist/public

  deploy:
    if: "!contains(github.event.head_commit.message, '[pages-sync]')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

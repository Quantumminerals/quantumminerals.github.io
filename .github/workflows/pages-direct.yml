name: Deploy GitHub Pages directly

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-direct
  cancel-in-progress: true

env:
  PAGES_BUILD_VERSION: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required pages files
        run: |
          test -f index.html
          test -f .nojekyll
          test -f sitemap.xml
          test -f robots.txt
          test -f leadership/sarah-thompson/index.html
          grep -q 'Sarah Thompson' leadership/sarah-thompson/index.html
          echo 'Required GitHub Pages files are present.'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

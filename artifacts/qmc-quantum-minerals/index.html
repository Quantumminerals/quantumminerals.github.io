<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>First Quantum Minerals | Materials with a future</title>
    <meta name="description" content="First Quantum Minerals is a Canadian mining company focused on the responsible development of the materials that move a connected world." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="First Quantum Minerals | Materials with a future" />
    <meta property="og:description" content="First Quantum Minerals is a Canadian mining company focused on the responsible development of the materials that move a connected world." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="First Quantum Minerals | Materials with a future" />
    <meta name="twitter:description" content="First Quantum Minerals is a Canadian mining company focused on the responsible development of the materials that move a connected world." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        const quoteText = 'Mining is not only about the resource in the ground';
        const descriptionText = 'As a member of the Board, Sarah brings an operator';
        function moveLeadershipMessage() {
          const quote = Array.from(document.querySelectorAll('p')).find((el) => el.textContent.includes(quoteText));
          const description = Array.from(document.querySelectorAll('p')).find((el) => el.textContent.includes(descriptionText));
          if (!quote || !description || quote.dataset.moved === 'true') return;
          const rightPanel = quote.closest('.flex.flex-col.justify-between');
          const card = rightPanel && rightPanel.parentElement && rightPanel.parentElement.parentElement;
          if (!card || !card.parentElement) return;
          const descriptionParent = description.parentElement;
          quote.remove();
          description.remove();
          if (descriptionParent && descriptionParent !== quote.parentElement) descriptionParent.remove();
          quote.className = 'max-w-[900px] text-base leading-7 text-[#d8d4c9] md:text-lg md:leading-8';
          description.className = 'mt-4 max-w-[780px] text-sm leading-6 text-[#92999a] md:text-base md:leading-7';
          const messageSection = document.createElement('div');
          messageSection.className = 'mt-8 border-t border-white/10 pt-8 md:mt-10 md:pt-10';
          messageSection.appendChild(quote);
          messageSection.appendChild(description);
          card.insertAdjacentElement('afterend', messageSection);
          quote.dataset.moved = 'true';
        }
        const observer = new MutationObserver(moveLeadershipMessage);
        observer.observe(document.documentElement, { childList: true, subtree: true });
        moveLeadershipMessage();
      })();
    </script>
  </body>
</html>
